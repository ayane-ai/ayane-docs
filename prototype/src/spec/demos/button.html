<!-- ============================================================
   示例片段 · 按钮
   ============================================================ -->
<section class="demo-card">
  <div class="demo-meta">
    <span class="demo-no">04</span>
    <h4>按钮 Button</h4>
    <p class="spec-note">
      四档语义（默认描边 / 主操作渐变 / 幽灵 / 危险）×三档高度（30 / 36 / 48）。
      状态用 <code>:disabled</code>、<code>aria-pressed</code>、<code>.is-loading</code> 表达，
      与视觉同步；动画只动 <code>transform</code> 与 <code>opacity</code>。
    </p>
  </div>
  <div class="demo-vars">
    <div class="demo-frame">
      <span class="demo-label">语义四档</span>
      <div class="demo-row">
        <button class="btn btn--primary" type="button">保存草稿</button>
        <button class="btn" type="button">导出</button>
        <button class="btn btn--ghost" type="button">取消</button>
        <button class="btn btn--danger" type="button">回收会话</button>
      </div>
      <span class="demo-label">高度三档 30 / 36 / 48</span>
      <div class="demo-row">
        <button class="btn btn--primary btn--sm" type="button">小号 30</button>
        <button class="btn btn--primary" type="button">标准 36</button>
        <button class="btn btn--primary btn--lg" type="button">大号 48</button>
      </div>
      <span class="demo-label">状态</span>
      <div class="demo-row">
        <button class="btn btn--primary" type="button">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-plus"></use></svg>
          带图标
        </button>
        <button class="btn" type="button" disabled>已禁用</button>
        <button class="btn btn--primary is-loading" type="button">提交中</button>
      </div>
    </div>
    <div class="demo-frame">
      <span class="demo-label">块级与图标按钮</span>
      <div class="demo-row">
        <button class="btn btn--primary btn--lg btn--block" type="submit">占满一行（登录、空状态主行动）</button>
      </div>
      <span class="demo-label">图标按钮：视觉 32px，命中区靠 <code>::after</code> 负 inset 撑到 44px</span>
      <div class="demo-row">
        <button class="icon-btn" type="button" aria-label="搜索">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-search"></use></svg>
        </button>
        <button class="icon-btn" type="button" aria-label="设置">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-gear"></use></svg>
        </button>
        <button class="icon-btn" type="button" aria-pressed="true" aria-label="显示口令">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-eye"></use></svg>
        </button>
        <button class="icon-btn" type="button" disabled aria-label="不可用">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-lock"></use></svg>
        </button>
        <span class="demo-label">带角标</span>
        <button class="icon-btn" type="button" aria-label="通知，3 条未读">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-bell"></use></svg>
          <span class="nav-badge">3</span>
        </button>
      </div>
      <p class="demo-hint"><code>.is-loading</code> 用透明文字 + 伪元素环，切换时宽度不跳动。</p>
    </div>
  </div>
</section>
